name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q gateway codex_bridge gateway_server.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Enforce architecture limits
        run: |
          test -z "$(find . -name '*.py' -not -path './.git/*' -exec awk 'FNR==201 {print FILENAME}' {} +)"
          test -z "$(find . -type d -not -path './.git*' -exec sh -c 'n=$(find "$1" -maxdepth 1 -type f | wc -l); [ "$n" -gt 8 ] && echo "$1: $n"' _ {} \;)"
